
services:
  ai-scanner-api:
    build: .
    container_name: cs_ai_scanner
    restart: always
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - LOG_FILE=${LOG_FILE:-/var/log/nginx/cs_ssl_access.log}
      - OUTPUT_JSON=${OUTPUT_JSON:-/app/data/security-data.json}
    ports:
      - "1234:1234"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${HOST_LOG_PATH:-/var/log/nginx/cs_ssl_access.log}:/var/log/nginx/cs_ssl_access.log:ro
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
